[project]
name = "gem-studio"
version = "0.1.0"
description = "Desktop viewer for gem (Dota 2 replay parser): PySide6 shell with the docs-site figures in a web view"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The engine, from PyPI, pinned to a range the app is tested against. Upgrade
    # deliberately: bump the range, run the tests, rebuild.
    "gem-dota>=0.13,<0.14",
    "PySide6>=6.7",
    "pillow>=12.1.1",  # map crops for the fight playbacks (the site exporter uses it)
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gemstudio"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short", "-m", "not slow"]
markers = [
    "gui: needs Qt WebEngine and the built figures (app/web/dist); run offscreen",
    "slow: reads the full replay in the repo root (minutes when its cache is cold); run with -m slow",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gemstudio"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
