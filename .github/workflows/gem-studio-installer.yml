# Builds the Gem Studio Windows installer (app/). Additive: it does not touch the engine's own
# workflows. It runs only when started by hand or when a tag named studio-v* is pushed, so merging
# upstream never triggers it.
#
# NOT YET RUN: this file was written alongside the local build (app/scripts/build_app.ps1), which
# has been run and tested. The first run on GitHub may need small fixes.
name: Gem Studio installer

on:
  workflow_dispatch:
  push:
    tags: ["studio-v*"]

permissions:
  contents: write # to attach the installer to a release on a tag

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python environment
        shell: pwsh
        run: |
          python -m venv app/.venv
          app\.venv\Scripts\python -m pip install --upgrade pip
          app\.venv\Scripts\python -m pip install -r app/requirements-build.txt pytest

      # The Windows runner image has Inno Setup 6 installed (the build script looks for it).
      - name: Build (figures, bundle, self-test, installer)
        shell: pwsh
        # A hosted runner may have no real display: let the app's self-test run without one.
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: ./app/scripts/build_app.ps1

      - name: Fast tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          cd app
          .\.venv\Scripts\python -m pytest -q -m "not gui and not slow"

      - uses: actions/upload-artifact@v4
        with:
          name: GemStudio-installer
          path: |
            app/build/installer/GemStudio-Setup-*.exe
            app/build/selftest-report.json

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/studio-v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/installer/GemStudio-Setup-*.exe
